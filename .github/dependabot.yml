version: 2
updates:
  - package-ecosystem: npm
    directory: /mythic-plus-party-shuffle-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ui
    groups:
      ui-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /mythic-plus-party-shuffle-api-nest
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - api
    groups:
      api-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
