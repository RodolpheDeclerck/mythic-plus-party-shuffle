version: 2
updates:
  # Root-level npm workspaces: Dependabot must scan from the root package.json
  # so it can update the single root package-lock.json (sub-project lockfiles
  # are gitignored and not used by CI). Listing sub-projects directly leaves
  # the root lockfile out of sync and breaks `npm ci`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
