name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces)
        run: npm ci

      - name: Lint
        run: npm run lint -w mythic-plus-party-shuffle

      - name: Format check
        run: npm run format:check -w mythic-plus-party-shuffle

      - name: Typecheck
        run: npm run typecheck -w mythic-plus-party-shuffle

      - name: Test (with coverage)
        run: npm run test:ci -w mythic-plus-party-shuffle

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: mythic-plus-party-shuffle-ui/coverage
          if-no-files-found: ignore

      - name: Build
        run: npm run build -w mythic-plus-party-shuffle

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces)
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate -w mythic-plus-party-shuffle-api-nest

      - name: Prisma validate
        run: npm run prisma:validate -w mythic-plus-party-shuffle-api-nest

      - name: Lint
        run: npm run lint -w mythic-plus-party-shuffle-api-nest

      - name: Format check
        run: npm run format:check -w mythic-plus-party-shuffle-api-nest

      - name: Typecheck
        run: npm run typecheck -w mythic-plus-party-shuffle-api-nest

      - name: Test (with coverage)
        run: npm run test:cov -w mythic-plus-party-shuffle-api-nest

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: mythic-plus-party-shuffle-api-nest/coverage
          if-no-files-found: ignore

      - name: Build
        run: npm run build -w mythic-plus-party-shuffle-api-nest
