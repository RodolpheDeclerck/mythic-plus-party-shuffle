# Works with Root Directory = empty (repo root) OR = mythic-plus-party-shuffle-ui (see entry scripts).
# See mythic-plus-party-shuffle-ui/README.md → Deploy / Render.
services:
  - type: web
    name: mythic-plus-party-shuffle-ui
    runtime: node
    plan: free
    buildCommand: if [ -f mythic-plus-party-shuffle-ui/render-build-entry.sh ]; then bash mythic-plus-party-shuffle-ui/render-build-entry.sh; else bash render-build-entry.sh; fi
    startCommand: if [ -f mythic-plus-party-shuffle-ui/render-start-entry.sh ]; then bash mythic-plus-party-shuffle-ui/render-start-entry.sh; else bash render-start-entry.sh; fi
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NEXT_PUBLIC_API_URL
        value: https://api.mythic-plus-party-shuffle.ca
      - key: BACKEND_URL
        value: https://api.mythic-plus-party-shuffle.ca
